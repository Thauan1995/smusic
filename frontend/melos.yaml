name: smusic

packages:
  - packages/core/**
  - packages/domain/**
  - packages/data/**
  - packages/presentation/**
  - app/**

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  analyze:
    run: melos exec -- "flutter analyze --no-fatal-infos"
    description: Run flutter analyze in every package.

  test:
    run: melos exec --dir-exists=test -- "flutter test --coverage"
    description: Run flutter test with coverage in every package that has a test/ dir.

  format-check:
    run: melos exec -- "dart format --output=none --set-exit-if-changed ."
    description: Check formatting in every package.

  check-layers:
    run: bash tool/check_layer_deps.sh
    description: >-
      Enforce domain/presentation/data layering rules (frontend-flutter.md
      1.2). Grep-based, documented as a simplified stand-in for a full
      dart_dependency_validator/custom-lint CI rule (see README TODO).
