name: smusic_mobile
description: >
  Mobile entrypoint (iOS/Android). Thin main.dart per
  frontend-flutter.md section 1.3 - registers concrete core_platform/
  *_data implementations and mounts the shared SmusicApp widget. This is
  one of only two places in the monorepo allowed to import a native plugin
  package directly or contain platform-conditional code (the other is
  smusic_web).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  smusic_app_shared:
    path: ../smusic_app_shared
  core_platform:
    path: ../../packages/core/core_platform
  core_networking:
    path: ../../packages/core/core_networking
  auth_domain:
    path: ../../packages/domain/auth_domain
  auth_data:
    path: ../../packages/data/auth_data
  library_domain:
    path: ../../packages/domain/library_domain
  library_data:
    path: ../../packages/data/library_data
  player_domain:
    path: ../../packages/domain/player_domain
  player_data:
    path: ../../packages/data/player_data
  social_proximity_domain:
    path: ../../packages/domain/social_proximity_domain
  social_proximity_data:
    path: ../../packages/data/social_proximity_data

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Required for the MaterialIcons font asset to actually be bundled into
# this app's build - without it, every Icons.* usage renders as a "tofu"
# box (missing-glyph placeholder) at runtime. Flutter reads this from the
# entrypoint app's own pubspec, not from a dependency's.
flutter:
  uses-material-design: true
