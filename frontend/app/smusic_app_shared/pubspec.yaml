name: smusic_app_shared
description: >
  The single SmusicApp widget (root MaterialApp.router + theme), shared
  verbatim between smusic_mobile and smusic_web
  (frontend-flutter.md section 1.3 - "SmusicApp ... é um único pacote
  compartilhado, zero diferença de código-fonte entre as duas entradas").
  Not listed as its own package in frontend-flutter.md section 1.2's tree
  (which shows no explicit home for SmusicApp) - documented as a small,
  necessary addition so the root widget has exactly one source location
  both thin entrypoints import, rather than being duplicated into
  app/smusic_mobile and app/smusic_web or bolted onto shared_navigation
  (which section 1.2 scopes to "go_router config, shell de navegação", not
  app-root/theme wiring). See frontend/README.md "Desvios da spec".
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  auth_domain:
    path: ../../packages/domain/auth_domain
  core_design_system:
    path: ../../packages/core/core_design_system
  shared_navigation:
    path: ../../packages/presentation/shared_navigation
  library_domain:
    path: ../../packages/domain/library_domain
  player_domain:
    path: ../../packages/domain/player_domain
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
