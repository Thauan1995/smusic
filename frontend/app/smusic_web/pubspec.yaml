name: smusic_web
description: >
  Web entrypoint. Thin main.dart per frontend-flutter.md section 1.3 -
  registers concrete core_platform/*_data implementations and mounts the
  shared SmusicApp widget. Source-identical to smusic_mobile's wiring in
  Fatia 1 (just_audio's web backend/just_audio_web is selected
  automatically by the just_audio package itself based on platform, not by
  anything in this file - see frontend-flutter.md section 1.3's table).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  smusic_app_shared:
    path: ../smusic_app_shared
  core_platform:
    path: ../../packages/core/core_platform
  core_networking:
    path: ../../packages/core/core_networking
  auth_domain:
    path: ../../packages/domain/auth_domain
  auth_data:
    path: ../../packages/data/auth_data
  library_domain:
    path: ../../packages/domain/library_domain
  library_data:
    path: ../../packages/data/library_data
  player_domain:
    path: ../../packages/domain/player_domain
  player_data:
    path: ../../packages/data/player_data
  social_proximity_domain:
    path: ../../packages/domain/social_proximity_domain
  social_proximity_data:
    path: ../../packages/data/social_proximity_data

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
