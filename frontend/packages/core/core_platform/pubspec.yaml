name: core_platform
description: >
  Platform abstraction interfaces (audio engine, location, offline storage)
  plus the concrete implementations registered at the app composition root.
  See docs/architecture/frontend-flutter.md section 1.3.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.40
  geolocator: ^14.0.0
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
