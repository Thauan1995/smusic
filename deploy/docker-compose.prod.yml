# Production deploy stack. Run from the VPS, from the repo root:
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build postgres redis
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod run --rm migrate
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
#
# See deploy/README.md for the full step-by-step (Oracle Cloud VM setup,
# firewall, .env.prod values). Only "caddy" publishes ports to the host —
# postgres/redis/server/presence-server are reachable only on the internal
# compose network, by service name.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smusic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: smusic
    volumes:
      - smusic_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smusic -d smusic"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-off: applies migrations/*.up.sql and exits. Run explicitly (see
  # header comment above) — not wired as a dependency of server/
  # presence-server, so `up -d` on its own never blocks on it.
  migrate:
    build:
      context: ../backend
      target: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: ../backend
      target: server
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_ADDR: ${REDIS_ADDR}
      JWT_ED25519_SEED_HEX: ${JWT_ED25519_SEED_HEX}
      JWT_ISSUER: smusic
      PASSWORD_PEPPER_HEX: ${PASSWORD_PEPPER_HEX}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL}
      MEDIA_SIGNING_KEY: ${MEDIA_SIGNING_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      ENV: ${ENV}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  presence-server:
    build:
      context: ../backend
      target: presence-server
    environment:
      PRESENCE_HTTP_ADDR: ":8081"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_ADDR: ${REDIS_ADDR}
      JWT_ED25519_SEED_HEX: ${JWT_ED25519_SEED_HEX}
      JWT_ISSUER: smusic
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      ENV: ${ENV}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    build:
      context: ..
      dockerfile: frontend/app/smusic_web/Dockerfile
      args:
        SMUSIC_API_BASE_URL: ${SMUSIC_API_BASE_URL}
    environment:
      SMUSIC_DOMAIN: ${SMUSIC_DOMAIN}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - smusic_caddy_data:/data
      - smusic_caddy_config:/config
    depends_on:
      - server
      - presence-server
    restart: unless-stopped

volumes:
  smusic_postgres_data:
  smusic_caddy_data:
  smusic_caddy_config:
