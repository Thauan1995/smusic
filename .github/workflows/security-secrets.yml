name: security-secrets

# Secret-scanning gate — .vibeflow/specs/security-ci-gates.md. Scans git
# history/diff (never the raw filesystem — a local .env file is correctly
# gitignored dev-only config, not a leak; see this spec's evidence log for
# why a filesystem-level scan is the wrong tool here). Verified 2026-09-04:
# `gitleaks detect` against full history (16 commits) found 0 leaks.

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
