name: backend-ci

# Backend Go quality + security gates — .vibeflow/specs/security-ci-gates.md.
# All jobs run against the unit-test tier only (fakes/miniredis, no real
# Postgres/Redis needed — see backend-testing.md), so this workflow needs
# no service containers. Every job here is REQUIRED (fail-closed): a
# Critical/High finding blocks the merge, per security.md §4's "pipeline
# bloqueia merge/deploy" requirement — this is not a warn-only report.

on:
  push:
    branches: [master, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  build-test-vet:
    name: build, vet, race tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  test-integration:
    name: integration tests (real Postgres via testcontainers-go)
    runs-on: ubuntu-latest
    # .vibeflow/specs/backend-integration-test-coverage.md: internal/*/postgres
    # repos are 0% in the unit tier by design (see each package's doc
    # comment) — this job is what actually exercises them. ubuntu-latest
    # runners ship Docker natively, so testcontainers-go needs no extra
    # `services:` config here (unlike a fixed docker-compose Postgres
    # service, it starts/tears down its own ephemeral container per test).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: go test -tags=integration ./...

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...

  govulncheck:
    name: govulncheck (code-reachable vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # govulncheck's default (non -mode=source-and-symbols) call-graph
      # analysis only fails on vulnerabilities the code actually calls —
      # a vulnerable-but-uncalled transitive dependency (e.g. this repo's
      # golang.org/x/crypto/ssh findings, pulled in transitively and never
      # imported) is reported but does not fail the build. That's the
      # correct signal for a merge gate: see security.md §6's own
      # "Crítico"/"Alto" definitions, which are about exploitability, not
      # dependency-tree presence.
      - run: govulncheck ./...

  gosec:
    name: gosec (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      # Fails the build on ANY finding by default (gosec's own severity
      # tiers already cover security.md §6's Alto/Crítico bar for this
      # codebase's size) — every current finding is either fixed for real
      # or has a reviewed #nosec justification, see
      # .vibeflow/specs/security-ci-gates.md's evidence log.
      - run: gosec ./...
