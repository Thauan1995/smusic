services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smusic
      POSTGRES_PASSWORD: smusic
      POSTGRES_DB: smusic
    ports:
      - "5432:5432"
    volumes:
      - smusic_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smusic -d smusic"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smusic_postgres_data:
